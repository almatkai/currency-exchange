[package]
name = "tezbar-currency-exchange"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2", version = "=0.1.1" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "=2.5.4"
indexmap = "=2.7.1"
regex = "=1.11.1"
chrono = { version = "=0.4.39", default-features = false, features = ["std"] }
sha2 = "=0.10.8"
fs2 = "=0.4.3"
tempfile = "=3.15.0"
ryu-js = "=1.0.2"
base64 = "=0.22.1"

[dev-dependencies]
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "currency-exchange"
path = "src/main.rs"
